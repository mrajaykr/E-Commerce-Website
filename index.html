<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Green Heaven Nursery | Home</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="firebase.js" defer></script>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">🌱 Green Heaven Nursery</div>

  <div class="search-bar-container">
    <input type="text" placeholder="Search plants..." class="search-bar">
  </div>

  <div class="nav-right">
    <div id="profileSection" class="profile" style="display:none">
      <i class="fa-solid fa-user" style="color:#005cfa"></i>
      <span id="firstNameText" class="user-name"></span>
      <div class="dropdown">
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>

    <div id="loginLink">
      <a href="login.html">Login</a>
    </div>

    <a href="cart.html" class="cart-link">
      Cart 🛒 (<span id="count">0</span>)
    </a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Welcome to Green Heaven Nursery</h1>
  <p>Your one-stop plant shop 🌿</p>
</section>

<!-- PRODUCTS -->
<section class="products">
  <h2>Featured Plants</h2>

  <div class="product-list">
    <div class="product-card">
      <img src="https://i.imgur.com/6oK0Fvq.jpg">
      <h3>Snake Plant</h3>
      <p>Air purifying</p>
      <p class="price">₹299</p>
      <button onclick="addToCart('Snake Plant',299,'https://i.imgur.com/6oK0Fvq.jpg')">
        Add to Cart
      </button>
    </div>

    <div class="product-card">
      <img src="https://i.imgur.com/27Z3yTI.jpg">
      <h3>Money Plant</h3>
      <p>Lucky plant</p>
      <p class="price">₹199</p>
      <button onclick="addToCart('Money Plant',199,'https://i.imgur.com/27Z3yTI.jpg')">
        Add to Cart
      </button>
    </div>
  </div>
</section>

<footer class="footer">
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</footer>

<!-- LOGIC -->
<script>
const CART_KEY = "greenHeavenCart";

/* ---------- CART ---------- */
function getCart() {
  return JSON.parse(localStorage.getItem(CART_KEY)) || [];
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function addToCart(name, price, image) {
  const cart = getCart();
  const item = cart.find(p => p.name === name);

  if (item) {
    item.quantity += 1;
  } else {
    cart.push({
      id: Date.now(),
      name,
      price,
      image,
      quantity: 1
    });
  }

  saveCart(cart);
  updateCartCount();
}

function updateCartCount() {
  const cart = getCart();
  const total = cart.reduce((s, i) => s + i.quantity, 0);
  document.getElementById("count").innerText = total;
}

updateCartCount();

/* ---------- AUTH UI ---------- */
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    document.getElementById("profileSection").style.display = "flex";
    document.getElementById("loginLink").style.display = "none";
    document.getElementById("firstNameText").innerText =
      user.displayName
        ? user.displayName.split(" ")[0]
        : user.email.split("@")[0];
  } else {
    document.getElementById("profileSection").style.display = "none";
    document.getElementById("loginLink").style.display = "block";
  }
});

function logout() {
  firebase.auth().signOut();
}
</script>

</body>
</html>
